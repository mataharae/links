    -webkit-mask-image:radial-gradient(circle,#000 35%,transparent 70%);mask-image:radial-gradient(circle,#000 35%,transparent 70%);
  }
  .wrap{position:relative;z-index:1;width:100%;max-width:460px;display:flex;flex-direction:column;align-items:center}

  /* ===== Hero: the original logo, blended into the matching page colour ===== */
  .hero{width:100%;text-align:center;padding-top:max(8px,env(safe-area-inset-top));animation:fade .9s ease both}
  .hero img{
    display:block;width:min(100%,340px);aspect-ratio:1;margin:0 auto;
    -webkit-mask-image:radial-gradient(closest-side,#000 82%,transparent 100%);mask-image:radial-gradient(closest-side,#000 82%,transparent 100%);
  }
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .tagline{margin-top:-4px;font-size:14.5px;color:var(--cream-dim);line-height:1.8}

  /* ===== Section heading ===== */
  .sec{width:100%;margin-top:30px;animation:rise .6s ease both}
  .sec-h{display:flex;align-items:center;gap:12px;margin-bottom:14px;color:var(--gold);font-size:13px;font-weight:600;letter-spacing:.02em}
  .sec-h::before,.sec-h::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line))}
  .sec-h::after{background:linear-gradient(-90deg,transparent,var(--line))}

  /* ===== Store card (primary) ===== */
  .store{
    position:relative;border-radius:22px;padding:22px 18px 18px;
    background:linear-gradient(160deg,rgba(194,161,83,.16),rgba(20,26,17,.35) 55%);
    border:1px solid rgba(194,161,83,.45);
    box-shadow:0 18px 40px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.06);
    overflow:hidden;
  }
  .store::before{ /* corner ornaments */
    content:"";position:absolute;inset:8px;border-radius:16px;pointer-events:none;
    border:1px solid rgba(194,161,83,.14);
  }
  .store-eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--bg-deep);background:var(--gold);padding:4px 12px;border-radius:999px}
  .store-eyebrow .svg{width:11px;height:11px}
  .store h2{font-size:22px;font-weight:700;margin:12px 0 6px;line-height:1.4}
  .store p{font-size:13.5px;color:var(--cream-dim);line-height:1.85;margin-bottom:18px}
  .store-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .shop{
    position:relative;display:flex;flex-direction:column;gap:10px;
    padding:14px 14px 12px;border-radius:14px;text-decoration:none;
    background:linear-gradient(145deg,var(--gold-hi),var(--gold) 50%,var(--gold-lo));
    color:#1f261a;box-shadow:0 8px 18px rgba(0,0,0,.22);
    transition:transform .2s ease,box-shadow .2s ease,filter .2s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .shop:hover{transform:translateY(-3px);box-shadow:0 14px 26px rgba(0,0,0,.3);filter:brightness(1.04)}
  .shop:active{transform:scale(.98)}
  .shop-top{display:flex;align-items:center;justify-content:space-between}
  .shop-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--bg-deep);color:var(--gold-hi)}
  .shop-ic .svg{width:17px;height:17px}
  .shop-plat{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;background:rgba(31,38,26,.14)}
  .shop-name{font-size:17px;font-weight:700;line-height:1.3}
  .shop-dom{font-size:12px;opacity:.72;direction:ltr;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .shop-cta{display:flex;align-items:center;justify-content:space-between;margin-top:2px;padding-top:9px;border-top:1px solid rgba(31,38,26,.18);font-size:13px;font-weight:600}
  .shop-cta .svg{width:12px;height:12px;transition:transform .2s ease}
  .shop:hover .shop-cta .svg{transform:translateX(-4px)}

  /* ===== WhatsApp bar ===== */
  .wa{
    margin-top:12px;display:flex;align-items:center;gap:14px;min-height:66px;padding:12px 16px;
    border-radius:var(--r);text-decoration:none;color:var(--cream);
    background:var(--panel);border:1px solid var(--line);
    transition:background .2s ease,border-color .2s ease,transform .2s ease;
  }
  .wa:hover{background:rgba(194,161,83,.1);border-color:rgba(194,161,83,.6);transform:translateY(-2px)}

  /* ===== Generic row ===== */
  .row{
    display:flex;align-items:center;gap:14px;min-height:64px;padding:12px 16px;
    border-radius:var(--r);text-decoration:none;color:var(--cream);
    background:var(--panel);border:1px solid var(--line);
    transition:background .2s ease,border-color .2s ease,transform .2s ease;
    -webkit-tap-highlight-color:transparent;min-width:0;
  }
  .row:hover{background:rgba(194,161,83,.1);border-color:rgba(194,161,83,.6);transform:translateY(-2px)}
  .row:active,.wa:active{transform:scale(.985)}
  .ic{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:rgba(194,161,83,.14);color:var(--gold-hi);border:1px solid rgba(194,161,83,.25)}
  .ic .svg{width:19px;height:19px}
  .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .t{font-size:15.5px;font-weight:600;line-height:1.4}
  .s{font-size:12.5px;color:var(--cream-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ltr{direction:ltr;text-align:right}
  .chev{flex:none;width:12px;height:12px;color:var(--gold-lo)}
  .stack{display:flex;flex-direction:column;gap:10px}

  /* ===== Social grid ===== */
  .social{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .soc{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    aspect-ratio:1/1.02;border-radius:16px;text-decoration:none;color:var(--cream);
    background:var(--panel);border:1px solid var(--line);
    transition:background .2s ease,border-color .2s ease,transform .2s ease,color .2s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .soc .svg{width:22px;height:22px;color:var(--gold-hi);transition:transform .2s ease}
  .soc span{font-size:11.5px;font-weight:500;color:var(--cream-dim)}
  .soc:hover{background:var(--gold);border-color:var(--gold);transform:translateY(-3px)}
  .soc:hover .svg{color:var(--bg-deep);transform:scale(1.08)}
  .soc:hover span{color:var(--bg-deep)}
  .soc:active{transform:scale(.96)}

  /* email rows */
  .mail{display:flex;gap:10px}
  .mail .row{flex:1}
  .copy{flex:none;width:54px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);color:var(--gold-hi);cursor:pointer;display:grid;place-items:center;transition:background .2s ease,border-color .2s ease}
  .copy .svg{width:16px;height:16px}
  .copy:hover{background:rgba(194,161,83,.1);border-color:rgba(194,161,83,.6)}

  a:focus-visible,button:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px}

  footer{margin-top:40px;text-align:center;font-size:12px;color:rgba(244,236,216,.45);display:flex;flex-direction:column;align-items:center;gap:10px}
  footer .orn{display:flex;align-items:center;gap:10px;color:var(--gold-lo)}
  footer .orn i{display:block;width:40px;height:1px;background:var(--gold-lo);opacity:.5}
  footer .en{font-family:"Cormorant Garamond",serif;font-size:14px;letter-spacing:.35em;color:var(--gold);direction:ltr;padding-left:.35em}

  .toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--cream);color:var(--bg-deep);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;transition:opacity .25s ease,transform .25s ease;z-index:10}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes fade{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  @media (max-width:350px){.store-grid{grid-template-columns:1fr}.social{grid-template-columns:repeat(3,1fr)}}
  @media (min-width:768px){.hero{padding-top:24px}.hero img{width:360px}}
</style>
</head>
<body>
<div class="watermark" aria-hidden="true"></div>

(function(){
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const svg = (n, cls) => { const i = ICONS[n]; return i ? '<svg class="svg ' + (cls||"") + '" viewBox="' + i[0] + '" fill="currentColor" aria-hidden="true"><path d="' + i[1] + '"/></svg>' : ""; };
  const ext = url => /^https?:/.test(url) ? ' target="_blank" rel="noopener noreferrer"' : "";

  $("#tagline").textContent = BRAND.tagline;
  $("#year").textContent = new Date().getFullYear();
  $("#storeEyebrow").innerHTML = svg("leaf") + esc(STORE.eyebrow);
  $("#h-store").textContent = STORE.title;
  $("#storeDesc").textContent = STORE.desc;

  $("#stores").innerHTML = STORE.shops.map(s =>
    '<a class="shop" href="' + esc(s.url) + '"' + ext(s.url) + '>' +
      '<div class="shop-top"><span class="shop-ic">' + svg(s.icon) + '</span></div>' +
      '<div><div class="shop-name">' + esc(s.name) + '</div><div class="shop-dom">' + esc(s.domain) + '</div></div>' +
      '<div class="shop-cta">تسوّق الآن' + svg("chevron-left") + '</div>' +
    '</a>').join("");

  const row = (it, href, sub, ltr) =>
    '<a class="row" href="' + esc(href) + '"' + ext(href) + '>' +
      '<span class="ic">' + svg(it.icon) + '</span>' +
      '<span class="tx"><span class="t">' + esc(it.title) + '</span><span class="s' + (ltr ? ' ltr' : '') + '">' + esc(sub) + '</span></span>' +
      svg("chevron-left", "chev") + '</a>';

  $("#whatsapp").innerHTML = row({ title: WHATSAPP.title, icon: "whatsapp" }, WHATSAPP.url, WHATSAPP.sub, true).replace('class="row"', 'class="row wa"');

  $("#social").innerHTML = SOCIAL.map(s =>
    '<a class="soc" href="' + esc(s.url) + '"' + ext(s.url) + ' aria-label="' + esc(s.name) + '">' + svg(s.icon) + '<span>' + esc(s.name) + '</span></a>').join("");

  $("#contact").innerHTML = CONTACT.map(it => it.type === "email"
    ? '<div class="mail">' + row(it, "mailto:" + it.email, it.email, true) +
      '<button class="copy" type="button" data-copy="' + esc(it.email) + '" aria-label="نسخ ' + esc(it.email) + '">' + svg("copy") + '</button></div>'
    : row(it, it.url, it.sub, false)).join("");

  const toast = $("#toast"); let t;
  const show = m => { toast.textContent = m; toast.classList.add("show"); clearTimeout(t); t = setTimeout(() => toast.classList.remove("show"), 1800); };
  document.addEventListener("click", async e => {
    const b = e.target.closest("[data-copy]"); if (!b) return;
    try { await navigator.clipboard.writeText(b.dataset.copy); show("تم نسخ البريد الإلكتروني"); }
    catch { show(b.dataset.copy); }
  });
})();
